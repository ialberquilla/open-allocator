# Postgres for the local server (apps/server). The CLI and the stdio MCP server
# do not need it.
#   docker compose up -d
#   docker compose --profile tools up -d   # also adminer on 127.0.0.1:8088
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: open_allocator
      POSTGRES_PASSWORD: open_allocator
      POSTGRES_DB: open_allocator
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_allocator -d open_allocator"]
      interval: 2s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8088:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
