[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "open-allocator"
version = "0.9.0"
description = "Agent-operated, policy-bounded DeFi yield allocator on 1Tx (CLI)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
authors = [{ name = "Ivan Alberquilla" }]
keywords = ["defi", "ai-agents", "ethereum", "yield", "1tx", "cli"]
dependencies = [
    "eth-account==0.13.7",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "keyring==25.7.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "pyyaml==6.0.3",
    "safe-eth-py==7.7.0",
    "typer==0.26.7",
    "web3==7.16.0",
]

[project.urls]
Homepage = "https://github.com/ialberquilla/open-allocator"
Repository = "https://github.com/ialberquilla/open-allocator"

[dependency-groups]
dev = [
    "eth-tester==0.13.0b1",
    "py-evm==0.12.1b1",
    "mcp==2.2.0",
    "oa-server",
    "pytest==9.1.1",
    "ruff==0.15.19",
    "testcontainers[postgres]==4.15.0",
]

[project.scripts]
open-allocator = "open_allocator.cli:main"
open-allocator-mcp = "open_allocator.mcp:main"

[project.optional-dependencies]
mcp = [
    "mcp==2.2.0",
]

[tool.uv]
default-groups = ["dev"]
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["apps/server"]

[tool.uv.sources]
oa-server = { workspace = true }

[tool.ruff]
target-version = "py312"
src = ["src", "apps/server/src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/open_allocator"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/server/tests"]
markers = ["integration: hits live 1Tx API / RPC; skipped without creds"]

[tool.hatch.build.targets.sdist]
include = ["src/open_allocator", "pyproject.toml", "uv.lock"]
