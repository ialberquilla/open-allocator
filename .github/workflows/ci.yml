name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One run per ref. A new push supersedes the in-flight run instead of queueing
# behind it; runs on main are never cancelled, so the history stays complete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Lint workflow
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check

      - name: Check formatting
        run: uv run ruff format --check

      - name: Unit tests
        run: uv run pytest -q -m "not integration"

      - name: Build package
        run: uv build
